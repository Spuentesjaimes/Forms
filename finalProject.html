<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WEB-115 Final Project</title>

  <!-- Link to the external CSS and JavaScript files -->
  <link rel="stylesheet" href="style.css">
  <script src="projectJS.js" defer></script>

  <!-- Internal CSS styling for the form and layout -->
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(to right, #f0f8ff, #e6ffe6);
      margin: 0;
      padding: 0;
    }
    header {
      background: #4CAF50;
      color: white;
      padding: 20px;
      text-align: center;
      font-size: 1.7em;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }
    form {
      background-color: #ffffff;
      max-width: 900px;
      margin: 30px auto;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
    }
    fieldset {
      border: 2px solid #4CAF50;
      border-radius: 6px;
      margin-bottom: 20px;
      padding: 15px;
    }
    legend {
      font-weight: bold;
      color: #4CAF50;
      padding: 0 10px;
    }
    label {
      display: block;
      margin-top: 10px;
      font-weight: bold;
      color: #333;
    }
    input[type="text"],
    input[type="email"],
    textarea {
      width: 100%;
      padding: 8px;
      margin-top: 4px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 0.95em;
    }
    textarea {
      height: 60px;
    }
    button {
      background-color: #4CAF50;
      color: white;
      border: none;
      padding: 10px 20px;
      margin-top: 15px;
      font-size: 1em;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    button:hover {
      background-color: #45a049;
    }
    h3 {
      color: #2e7d32;
      background-color: #e8f5e9;
      padding: 6px 10px;
      border-left: 6px solid #66bb6a;
      border-radius: 4px;
      margin-top: 20px;
    }
    input[type="text"]:focus {
      outline: none;
      border-color: #66bb6a;
      background-color: #f9fff9;
    }
    .meal-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 10px;
      background-color: #fefefe;
      border: 1px dashed #ccc;
      border-radius: 6px;
      margin-bottom: 20px;
    }
    .meal-container:hover {
      background-color: #f0fff5;
      transition: background-color 0.3s;
    }
  </style>
</head>
<body>
  <!-- Page Header with Name, Course Info, and Project Title -->
  <header>
    Stefany Puentes Jaimes - WEB-115-0004<br>
    <span style="font-size: 1.1em;">✨ Build Your Meal Plan ✨</span>
  </header>

  <!-- Main Form for Inputting Personal Information and Meal Plan -->
  <form id="mealForm">

    <!-- Section for Name, Email, and Weekly Goal -->
    <fieldset>
      <legend>Personal Information</legend>
      <label for="name">Name:</label>
      <input type="text" id="name" required>

      <label for="email">Email:</label>
      <input type="email" id="email" required>

      <label for="goal">Goal for the Week:</label>
      <textarea id="goal"></textarea>
    </fieldset>

    <!-- Dynamic Section for Weekly Meal Entries -->
    <fieldset>
      <legend>Weekly Meal Plan</legend>
      <div id="mealInputs"></div> <!-- JavaScript will populate this -->
    </fieldset>

    <!-- Action Buttons -->
    <button type="button" onclick="generateMealPlan()">Generate Meal Plan</button>
    <button type="button" onclick="clearForm()">Clear Planner</button>
  </form>

  <!-- JavaScript runs after page loads to generate inputs for each day/meal -->
  <script>
    window.onload = function () {
      const days = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
      const meals = ["Breakfast", "Snack 1", "Lunch", "Snack 2", "Dinner"];
      const container = document.getElementById("mealInputs");

      // For each day, this creates a section with labels and inputs for each meal
      days.forEach(day => {
        const dayDiv = document.createElement("div");
        dayDiv.classList.add("meal-container");
        const dayHeader = document.createElement("h3");
        dayHeader.textContent = day;
        dayDiv.appendChild(dayHeader);

        meals.forEach(meal => {
          const label = document.createElement("label");
          label.setAttribute("for", `${day}-${meal}`);
          label.textContent = `${meal} for ${day}`;

          const input = document.createElement("input");
          input.type = "text";
          input.id = `${day}-${meal}`;
          input.name = `${day}-${meal}`;

          // Add label and input to the day's box
          dayDiv.appendChild(label);
          dayDiv.appendChild(input);
        });

        // Add the full day's input section to the form box
        container.appendChild(dayDiv);
      });
    }
  </script>
</body>
</html>
